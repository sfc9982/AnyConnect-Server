name: Apply reviewed QA patch
on:
  push:
    branches: [test/ipv6-load-systemd-vps]
    paths: [.github/workflows/apply-reviewed-qa-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'sfc9982/AnyConnect-Server' && github.actor == 'sfc9982' && github.ref == 'refs/heads/test/ipv6-load-systemd-vps'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply exactly the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/qa-transport/part{1,2,3,4} | base64 --decode | gzip -d > "$RUNNER_TEMP/reviewed.patch"
          echo '6597f1ccde89661c3080098e928d019e1ce86b83897c35f6440e62b68112fc45'"  $RUNNER_TEMP/reviewed.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/reviewed.patch"
          git apply "$RUNNER_TEMP/reviewed.patch"
          git add ocserv.sh ocserv-en.sh tests/vpn-target.py tests/vpn-vpnc.sh tests/test_production.py tests/vpn_lab.py tests/vpn_vm.py tests/vpn-production-server.sh tests/vpn-boot-guest.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: implement dual-stack traffic, upstream firewall profiles, soak and real VM reboot validation'
          git push origin HEAD:refs/heads/test/ipv6-load-systemd-vps
